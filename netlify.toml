# Netlify — OléCAD (Eleventy build)
[build]
  command = "npm run build"
  publish = "_site"
[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "https://www.olecad.com/*"
  to = "https://olecad.com/:splat"
  status = 301
  force = true
