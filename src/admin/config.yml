# ============================================================
#  OléCAD — Configuración del sistema de redacción (Decap CMS)
#  IMPORTANTE: abajo, poner "repo" con vuestra ruta GitHub (Owner/Repo).
# ============================================================
backend:
  name: github
  repo: Ohmycad/site-olecad
  branch: main

locale: es
site_url: https://olecad.com
display_url: https://olecad.com
publish_mode: simple

media_folder: "src/assets/img/blog"
public_folder: "/assets/img/blog"

collections:
  - name: "blog"
    label: "Artículos del blog"
    label_singular: "Artículo"
    description: "Escribir un artículo nuevo o editar uno existente."
    folder: "src/blog"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}  —  {{category}}  ({{date}})"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD" }
      - label: "Categoría"
        name: "category"
        widget: "select"
        # Categorías ampliables libremente:
        options: ["SOLIDWORKS", "3DEXPERIENCE", "Consejos y tutoriales", "Sector e industria", "Red Ohmycad"]
      - { label: "Descripción breve", name: "excerpt", widget: "text", hint: "1–2 frases. Aparece en la lista del blog y en Google." }
      - { label: "Imagen de portada (opcional)", name: "cover", widget: "image", required: false, media_folder: "/src/assets/img/blog", public_folder: "/assets/img/blog" }
      - { label: "Autor", name: "author", widget: "string", default: "Equipo OléCAD" }
      - { label: "Contenido", name: "body", widget: "markdown" }
